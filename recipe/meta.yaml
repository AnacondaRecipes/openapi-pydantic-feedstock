{% set name = "openapi-pydantic" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace("-", "_") }}-{{ version }}.tar.gz
  sha256: 11f3ac6ad41521fc156381ec587246b0c0ecea523bd9565ed74d3e7fac9d91cd

build:
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - pip
    - hatchling >=1.26
  run:
    - python
    - pydantic >=1.8

test:
  imports:
    - openapi_pydantic
    - openapi_pydantic.compat
    - openapi_pydantic.v3.v3_1
    - openapi_pydantic.v3.v3_0
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
  requires:
    - pip

about:
  home: https://github.com/mike-oakley/openapi-pydantic
  summary: Pydantic OpenAPI schema implementation
  description: |
    OpenAPI schema implemented in Pydantic. Both Pydantic 1.8+ and 2.x are supported.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://github.com/mike-oakley/openapi-pydantic
  dev_url: https://github.com/mike-oakley/openapi-pydantic

extra:
  recipe-maintainers:
    - thewchan
